<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>J.S. Holliday</title>
  <meta name="description" content="J.S. Holliday (1924–2006), historian of the California Gold Rush and author of The World Rushed In." />
  <meta name="robots" content="noindex" />
  <style>
    :root { --paper: #faf7f2; --ink: #2a2420; --muted: #6b5d52; --accent: #7a5a3a; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem 1rem;
    }
    h1 { font-weight: normal; font-size: clamp(2rem, 6vw, 3.25rem); margin: 0; letter-spacing: .01em; }
    .dates { color: var(--muted); margin: .4rem 0 0; font-size: 1.15rem; }
    .rule { width: 3rem; border: 0; border-top: 1px solid var(--accent); margin: 1.75rem auto; }
    p { line-height: 1.7; max-width: 32rem; margin: 0 auto; }
    em { font-style: italic; }
    .soon { color: var(--muted); margin-top: 1.5rem; font-size: 1rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>J.S. Holliday</h1>
    <p class="dates">1924 – 2006</p>
    <hr class="rule" />
    <p>Historian of the California Gold Rush and author of <em>The World Rushed In</em>.</p>
    <p class="soon">This site is being prepared. In the meantime, visit
      <a href="https://belindavidorholliday.com/">belindavidorholliday.com</a>.</p>
  </main>
</body>
</html>
